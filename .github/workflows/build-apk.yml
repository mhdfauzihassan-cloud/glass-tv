name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (retries on network errors)
        working-directory: launcher
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i"
            if ./gradlew assembleRelease --console=plain; then
              exit 0
            fi
            echo "Failed, waiting 45s before retry"
            sleep 45
          done
          exit 1

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_id }}" \
            launcher/app/build/outputs/apk/release/app-release.apk \
            --title "Build ${{ github.run_id }}" \
            --notes "Glass TV launcher APK"
