name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            echo "Attempt $i"
            ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
            if grep -qE "error:|Compilation failed|Lint found" build.log; then
              grep -E "error:|Lint found|Explanation" build.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
            sleep 45
          done
          exit 1

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_id }}" \
            launcher/app/build/outputs/apk/release/app-release.apk \
            --title "Build ${{ github.run_id }}" \
            --notes "Glass TV launcher APK"
